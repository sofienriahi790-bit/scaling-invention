<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLANZI App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:15px;
  background:#111827;
  position:sticky;
  top:0;
}

/* FILTER */
.filters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:5px;
  padding:10px;
}

.filters button{
  padding:8px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

/* CARD */
.card{
  background:#1e293b;
  border-radius:15px;
  overflow:hidden;
  text-align:center;
  padding:10px;
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:10px;
}

/* BUTTON */
button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
}

/* CART */
.cart{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#111827;
  padding:10px;
}

</style>
</head>

<body>

<header>
🍽️ GLANZI RESTAURANT <br>
🛒 <span id="count">0</span> items
</header>

<!-- FILTER -->
<div class="filters">
<button onclick="filter('all')">All</button>
<button onclick="filter('food')">Food</button>
<button onclick="filter('drink')">Drink</button>
<button onclick="filter('dessert')">Dessert</button>
</div>

<!-- PRODUCTS -->
<div class="grid" id="menu"></div>

<!-- CART -->
<div class="cart">
Total: <b id="total">0</b> TND
</div>

let total=0;

/* ================= 50 PRODUCTS ================= */

{name:"Ice Cream Cup",price:8,category:"dessert",img:"https://source.unsplash.com/400x300/?ice-cream-cup"},
{name:"Pudding",price:6,category:"dessert",img:"https://source.unsplash.com/400x300/?pudding"}

];

let filtered=[];

/* DISPLAY */
function display(){
let menu=document.getElementById("menu");
menu.innerHTML="";

filtered = current==="all" ? products : products.filter(p=>p.category===current);

filtered.forEach((p,i)=>{
menu.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>${p.price} TND</p>
<button onclick="add(${i})">Add</button>
</div>`;
});
}

display();

/* FILTER */
function filter(c){
current=c;
display();
}

/* CART */
function add(i){
let item=filtered[i];
cart.push(item);
total+=item.price;

document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText=total;
}

</script>

</body>
</html>
